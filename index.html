<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розклад РЗ-232</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f3f5fa;
    color: #1d2330;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
    max-width: 720px;
    margin: auto;
    padding: 16px;
}

.header {
    background: linear-gradient(135deg,#6674f4,#8468e9);
    color: white;
    border-radius: 24px;
    padding: 28px 24px;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    margin: 10px 0 0;
    font-size: 17px;
}

.nav {
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 7px;
    margin-bottom: 8px;
}

button {
    border: 0;
    border-radius: 14px;
    background: white;
    padding: 14px 6px;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.today {
    background: #6574f4;
    color: white;
}

.week-button {
    width: 100%;
    margin-bottom: 14px;
    font-size: 15px;
}

.week-info {
    background: #fff4d8;
    border-radius: 14px;
    padding: 13px 16px;
    font-weight: 800;
    margin-bottom: 14px;
}

.day {
    background: white;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.day-title {
    font-size: 25px;
    font-weight: 850;
    margin-bottom: 10px;
}

.date {
    font-size: 15px;
    color: #777;
    margin-left: 8px;
}

.lesson {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 12px;
    padding: 17px 0;
    border-top: 1px solid #eee;
}

.time {
    color: #5262dc;
    font-weight: 850;
    font-size: 17px;
    line-height: 1.25;
}

.period {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.subject {
    font-size: 17px;
    font-weight: 850;
    line-height: 1.3;
}

.type {
    display: inline-block;
    margin-top: 7px;
    background: #eef0ff;
    color: #5362d8;
    padding: 5px 9px;
    border-radius: 9px;
    font-weight: 750;
    font-size: 13px;
}

.teacher {
    margin-top: 7px;
    color: #777;
    font-size: 14px;
}

.weeks {
    margin-top: 6px;
    color: #c96919;
    font-weight: 750;
    font-size: 13px;
}

.join {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 13px;
    border-radius: 11px;
    background: #6574f4;
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 850;
}

.empty {
    padding: 15px 0 5px;
    color: #888;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 13px;
    padding: 15px 0 30px;
}

@media (max-width: 400px) {
    .lesson {
        grid-template-columns: 78px 1fr;
    }

    button {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎓 РЗ-232</h1>
        <p id="headerDate"></p>
    </div>

    <div class="nav">
        <button onclick="previousDay()">⬅️ Назад</button>
        <button class="today" onclick="goToday()">📅 Сьогодні</button>
        <button onclick="nextDay()">Вперед ➡️</button>
    </div>

    <button class="week-button" onclick="showWholeWeek()">
        🗓 Весь тиждень
    </button>

    <div id="weekInfo"></div>
    <div id="content"></div>

    <div class="footer">
        Розклад РЗ-232 • 1 семестр
    </div>

</div>

<script>

const times = {
    1: "08:00–09:35",
    2: "09:50–11:25",
    3: "11:40–13:15",
    4: "13:30–15:05"
};

/* =========================
   ПОСИЛАННЯ
========================= */

const links = {

    accessLecture:
    "https://meet.google.com/mgt-bmnn-hgu",

    accessLab:
    "https://meet.google.com/rzc-eycg-ooq",

    cloud:
    "https://us04web.zoom.us/j/75523031710?pwd=8qb2Fz4vdLcajVKsxlX7chpuQ6PCSH.1",

    methodsLab:
    "https://us04web.zoom.us/j/5488209266?pwd=kAn1qlrBilMOIYGQ7ZDw48bFbBobCY.1&omn=74899672410",

    steg:
    "https://us05web.zoom.us/j/6012015122?pwd=bEp2tsMJoxeYHeevUVF1AQGR0GnBcG.1#success",

    cyber:
    "https://meet.google.com/hbq-szcd-tne",

    protectedSystems:
    "https://meet.google.com/rum-tati-rno"
};


/* =========================
   РОЗКЛАД РЗ-232
========================= */

const schedule = {

1: {
    name: "Понеділок",
    lessons: [

        {
            number: 1,
            subject: "Основи стеганографії",
            type: "Лекція",
            teacher: "Борисенко І.І.",
            weeks: "all",
            link: links.steg
        },

        {
            number: 2,
            subject: "Проєктування захищених інформаційних систем",
            type: "Лекція",
            teacher: "Шаповалов Т.В.",
            weeks: "all",
            link: links.protectedSystems
        },

        {
            number: 3,
            subject: "Проєктування захищених інформаційних систем",
            type: "Лабораторна",
            teacher: "Шаповалов Т.В.",
            weeks: "even",
            link: links.protectedSystems
        }
    ]
},


2: {
    name: "Вівторок",
    lessons: [

        {
            number: 1,
            subject: "Управління доступом",
            type: "Лекція",
            teacher: "Сиропятов О.А.",
            weeks: "all",
            link: links.accessLecture
        },

        {
            number: 2,
            subject: "Методи оцінки захищеності інформаційних систем",
            type: "Лекція",
            teacher: "Агаджанян О.В.",
            weeks: "all",
            link: links.cloud
        },

        {
            number: 3,
            subject: "Основи захищених хмарних технологій",
            type: "Лабораторна",
            teacher: "Агаджанян О.В.",
            weeks: "even",
            link: links.cloud
        },

        {
            number: 4,
            subject: "Основи захисту мобільних пристроїв",
            type: "Лабораторна",
            teacher: "Садченко А.В.",
            weeks: "even",
            link: ""
        }
    ]
},


3: {
    name: "Середа",
    lessons: [

        {
            number: 2,
            subject: "Основи стеганографії",
            type: "Лабораторна",
            teacher: "Борисенко І.І.",
            weeks: "all",
            link: links.steg
        },

        {
            number: 3,
            subject: "Управління кібербезпекою",
            type: "Лекція",
            teacher: "Мельник М.О.",
            weeks: "all",
            link: links.cyber
        },

        {
            number: 4,
            subject: "Управління кібербезпекою",
            type: "Лабораторна",
            teacher: "Мельник М.О.",
            weeks: "all",
            link: links.cyber
        }
    ]
},


4: {
    name: "Четвер",
    lessons: [

        {
            number: 1,
            subject: "Управління доступом",
            type: "Лабораторна",
            teacher: "Вінковська І.С.",
            weeks: "all",
            link: links.accessLab
        },

        {
            number: 2,
            subject: "Методи оцінки захищеності інформаційних систем",
            type: "Лабораторна",
            teacher: "Дорофєєв Ю.М.",
            weeks: "all",
            link: links.methodsLab
        },

        {
            number: 3,
            subject: "Основи захисту мобільних пристроїв",
            type: "Лекція",
            teacher: "Садченко А.В.",
            weeks: "all",
            link: ""
        }
    ]
},


5: {
    name: "П’ятниця",
    lessons: []
}

};


/* =========================
   НАВЧАЛЬНІ ТИЖНІ
   1-й тиждень = 01–06.09
   2-й = 07–13.09
========================= */

const semesterStart = new Date(2026, 8, 1, 12, 0, 0);

const weekOneMonday =
    new Date(2026, 7, 31, 12, 0, 0);


function dateOnly(date) {
    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate(),
        12,0,0
    );
}


function getAcademicWeek(date) {

    const d = dateOnly(date);

    if (d < semesterStart) return 0;

    const milliseconds =
        d - weekOneMonday;

    const days =
        Math.floor(milliseconds / 86400000);

    return Math.floor(days / 7) + 1;
}


function lessonIsActive(lesson, week) {

    if (week < 1 || week > 15)
        return false;

    if (lesson.weeks === "all")
        return true;

    if (lesson.weeks === "even")
        return week % 2 === 0;

    if (lesson.weeks === "odd")
        return week % 2 !== 0;

    return false;
}


function formatDate(date) {

    return date.toLocaleDateString(
        "uk-UA",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function weeksText(type) {

    if (type === "even")
        return "Парні тижні: 2, 4, 6, 8, 10, 12, 14";

    if (type === "odd")
        return "Непарні тижні: 1, 3, 5, 7, 9, 11, 13, 15";

    return "Кожного тижня";
}


/* =========================
   СТВОРЕННЯ ДНЯ
========================= */

function renderDayCard(date) {

    const dayNumber = date.getDay();
    const week = getAcademicWeek(date);

    if (dayNumber === 0 || dayNumber === 6) {

        const weekend =
            dayNumber === 6
            ? "Субота"
            : "Неділя";

        return `
        <div class="day">
            <div class="day-title">
                ${weekend}
                <span class="date">
                    ${formatDate(date)}
                </span>
            </div>

            <div class="empty">
                Вихідний 🎉
            </div>
        </div>
        `;
    }

    const day = schedule[dayNumber];

    const activeLessons =
        day.lessons.filter(
            lesson =>
                lessonIsActive(lesson, week)
        );

    let html = `

    <div class="day">

        <div class="day-title">

            ${day.name}

            <span class="date">
                ${formatDate(date)}
            </span>

        </div>
    `;


    if (activeLessons.length === 0) {

        html += `
        <div class="empty">
            Пар немає 🎉
        </div>
        `;
    }


    activeLessons.forEach(lesson => {

        html += `

        <div class="lesson">

            <div>

                <div class="time">
                    ${times[lesson.number]}
                </div>

                <div class="period">
                    ${lesson.number} пара
                </div>

            </div>


            <div>

                <div class="subject">
                    ${lesson.subject}
                </div>


                <div class="type">
                    ${lesson.type}
                </div>


                ${
                    lesson.teacher
                    ?
                    `<div class="teacher">
                    👨‍🏫 ${lesson.teacher}
                    </div>`
                    :
                    ""
                }


                <div class="weeks">
                    ${weeksText(lesson.weeks)}
                </div>


                ${
                    lesson.link
                    ?
                    `
                    <a
                    class="join"
                    href="${lesson.link}"
                    target="_blank"
                    rel="noopener noreferrer">

                    🎥 Приєднатися до пари

                    </a>
                    `
                    :
                    ""
                }

            </div>

        </div>
        `;
    });


    html += "</div>";

    return html;
}


/* =========================
   ІНФОРМАЦІЯ ПРО ТИЖДЕНЬ
========================= */

function renderWeekInfo(date) {

    const week =
        getAcademicWeek(date);

    let text = "";


    if (week < 1) {

        text =
        "Навчальний семестр ще не розпочався";

    } else if (week > 15) {

        text =
        "15 навчальних тижнів завершено";

    } else {

        const parity =
            week % 2 === 0
            ? "парний"
            : "непарний";

        text =
        `📚 ${week}-й навчальний тиждень • ${parity}`;
    }


    document.getElementById(
        "weekInfo"
    ).innerHTML =

    `<div class="week-info">
        ${text}
    </div>`;
}


/* =========================
   НАВІГАЦІЯ
========================= */

let selectedDate =
    dateOnly(new Date());


function showSelectedDay() {

    document.getElementById(
        "headerDate"
    ).textContent =

    formatDate(selectedDate);


    renderWeekInfo(
        selectedDate
    );


    document.getElementById(
        "content"
    ).innerHTML =

    renderDayCard(
        selectedDate
    );
}


function previousDay() {

    selectedDate.setDate(
        selectedDate.getDate() - 1
    );

    selectedDate =
        dateOnly(selectedDate);

    showSelectedDay();
}


function nextDay() {

    selectedDate.setDate(
        selectedDate.getDate() + 1
    );

    selectedDate =
        dateOnly(selectedDate);

    showSelectedDay();
}


function goToday() {

    selectedDate =
        dateOnly(new Date());

    showSelectedDay();
}


/* =========================
   ВЕСЬ ТИЖДЕНЬ
========================= */

function showWholeWeek() {

    let current =
        dateOnly(selectedDate);

    let dayNumber =
        current.getDay();

    if (dayNumber === 0)
        dayNumber = 7;


    const monday =
        new Date(current);

    monday.setDate(
        current.getDate()
        - dayNumber
        + 1
    );


    renderWeekInfo(monday);


    document.getElementById(
        "headerDate"
    ).textContent =
        "Весь тиждень";


    let html = "";


    for (let i = 0; i < 5; i++) {

        const d =
            new Date(monday);

        d.setDate(
            monday.getDate() + i
        );

        html +=
            renderDayCard(d);
    }


    document.getElementById(
        "content"
    ).innerHTML = html;
}


/* Запуск */

showSelectedDay();

</script>

</body>
</html>
