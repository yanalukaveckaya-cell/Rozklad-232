<body>

    <button id="fDone" onclick="setFilter('done')">✅ Виконані</button>

      <label>📝 Завдання</label>

<script>

/* =========================

========================= */

  "https://us04web.zoom.us/j/5488209266?pwd=kAn1qlrBilMOIYGQ7ZDw48bFbBobCY.1&omn=74899672410",

/* =========================

========================= */

const schedule={

/* ПОНЕДІЛОК */

2:{

    }

  ]
},


/* СЕРЕДА */

3:{
  name:"Середа",
  lessons:[

    {

      weeks:"all",

    },

    {

    },

    {

    }

  ]
},


/* ЧЕТВЕР */

4:{
  name:"Четвер",
  lessons:[

    {
      number:1,

      type:"Лабораторна",
      teacher:"Вінковська І.С.",
      weeks:"all",
      link:links.accessLab
    },

    {
      number:2,
      subject:"Методи оцінки захищеності інформаційних систем",
      type:"Лабораторна",
      teacher:"Дорофєєв Ю.М.",
      weeks:"all",
      link:links.methodsLab
    },

    {
      number:3,
      subject:"Основи захисту мобільних пристроїв",
      type:"Лекція",
      teacher:"Садченко А.В.",
      weeks:"all",
      link:links.sadchenko
    }

  ]
},


/* П'ЯТНИЦЯ */

5:{
  name:"П’ятниця",
  lessons:[]
}

};


/* =========================
   ПРЕДМЕТИ ДЛЯ ДОМАШКИ
========================= */

const subjects=[
  "Основи стеганографії",
  "Проєктування захищених інформаційних систем",
  "Управління доступом",
  "Методи оцінки захищеності інформаційних систем",
  "Основи захищених хмарних технологій",
  "Основи захисту мобільних пристроїв",
  "Управління кібербезпекою"
];

const subjectSelect=
  document.getElementById("hwSubject");

subjects.forEach(subject=>{

  const option=
    document.createElement("option");

  option.value=subject;
  option.textContent=subject;

  subjectSelect.appendChild(option);

});


/* =========================
   НАВЧАЛЬНІ ТИЖНІ

   1 тиждень: 01.09–06.09
   2 тиждень: 07.09–13.09
========================= */

const semesterStart=
  new Date(2026,8,1,12);

const weekOneMonday=
  new Date(2026,7,31,12);


function dateOnly(date){

  return new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate(),
    12
  );

}


function getAcademicWeek(date){

  const d=dateOnly(date);

  if(d<semesterStart){
    return 0;
  }

  const diff=
    Math.floor(
      (d-weekOneMonday)/86400000
    );

  return Math.floor(diff/7)+1;

}


function lessonIsActive(lesson,week){

  if(week<1 || week>15){
    return false;
  }

  if(lesson.weeks==="all"){
    return true;
  }

  if(lesson.weeks==="even"){
    return week%2===0;
  }

  if(lesson.weeks==="odd"){
    return week%2!==0;
  }

  return false;

}


function formatDate(date){

  return date.toLocaleDateString(
    "uk-UA",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function weeksText(type){

  if(type==="even"){
    return "Парні тижні: 2, 4, 6, 8, 10, 12, 14";
  }

  if(type==="odd"){
    return "Непарні тижні: 1, 3, 5, 7, 9, 11, 13, 15";
  }

  return "Кожного тижня";

}


/* =========================
   ВІДОБРАЖЕННЯ ДНЯ
========================= */

function renderDayCard(date){

  const dayNumber=date.getDay();
  const week=getAcademicWeek(date);


  if(dayNumber===0 || dayNumber===6){

    const name=
      dayNumber===6
      ? "Субота"
      : "Неділя";

    return `
      <div class="day">

        <div class="dayTitle">
          ${name}
          <span class="date">${formatDate(date)}</span>
        </div>

        <div class="empty">
          Вихідний 🎉
        </div>

      </div>
    `;

  }


  const day=schedule[dayNumber];

  const lessons=
    day.lessons.filter(
      lesson=>lessonIsActive(lesson,week)
    );


  let html=`

    <div class="day">

      <div class="dayTitle">
        ${day.name}
        <span class="date">${formatDate(date)}</span>
      </div>

  `;


  if(!lessons.length){

    html+=`
      <div class="empty">
        Пар немає 🎉
      </div>
    `;

  }


  lessons.forEach(lesson=>{

    html+=`

      <div class="lesson">

        <div>

          <div class="time">
            ${times[lesson.number]}
          </div>

          <div class="period">
            ${lesson.number} пара
          </div>

        </div>


        <div>

          <div class="subject">
            ${lesson.subject}
          </div>

          <div class="type">
            ${lesson.type}
          </div>

          ${
            lesson.teacher
            ?
            `<div class="teacher">
              👨‍🏫 ${lesson.teacher}
            </div>`
            :
            ""
          }

          <div class="weeks">
            ${weeksText(lesson.weeks)}
          </div>


          <div class="actions">

            ${
              lesson.link
              ?
              `<a
                class="join"
                href="${lesson.link}"
                target="_blank"
                rel="noopener noreferrer">
                🎥 Приєднатися
              </a>`
              :
              ""
            }

            <button
              class="hwButton"
              onclick='openHomeworkForm(${JSON.stringify(lesson.subject)})'>
              📝 Домашка
            </button>

          </div>

        </div>

      </div>

    `;

  });


  html+="</div>";

  return html;

}


/* =========================
   ТИЖДЕНЬ
========================= */

function renderWeekInfo(date){

  const week=getAcademicWeek(date);

  let text="";


  if(week<1){

    text="Навчальний семестр ще не розпочався";

  }

  else if(week>15){

    text="15 навчальних тижнів завершено";

  }

  else{

    const parity=
      week%2===0
      ? "парний"
      : "непарний";

    text=
      `📚 ${week}-й навчальний тиждень • ${parity}`;

  }


  document.getElementById("weekInfo").innerHTML=
    `<div class="weekInfo">${text}</div>`;

}


/* =========================
   ГОРТАННЯ ДНІВ
========================= */

let selectedDate=
  dateOnly(new Date());


function showSelectedDay(){

  document.getElementById("headerText").textContent=
    formatDate(selectedDate);

  renderWeekInfo(selectedDate);

  document.getElementById("scheduleContent").innerHTML=
    renderDayCard(selectedDate);

}


function previousDay(){

  selectedDate.setDate(
    selectedDate.getDate()-1
  );

  selectedDate=
    dateOnly(selectedDate);

  showSelectedDay();

}


function nextDay(){

  selectedDate.setDate(
    selectedDate.getDate()+1
  );

  selectedDate=
    dateOnly(selectedDate);

  showSelectedDay();

}


function goToday(){

  selectedDate=
    dateOnly(new Date());

  showSelectedDay();

}


/* =========================
   ВЕСЬ ТИЖДЕНЬ
========================= */

function showWholeWeek(){

  const current=
    dateOnly(selectedDate);

  let day=
    current.getDay();

  if(day===0){
    day=7;
  }


  const monday=
    new Date(current);

  monday.setDate(
    current.getDate()-day+1
  );


  renderWeekInfo(monday);

  document.getElementById("headerText").textContent=
    "Весь тиждень";


  let html="";


  for(let i=0;i<5;i++){

    const d=
      new Date(monday);

    d.setDate(
      monday.getDate()+i
    );

    html+=
      renderDayCard(d);

  }


  document.getElementById("scheduleContent").innerHTML=
    html;

}

  document
    .getElementById("scheduleSection")
    .classList.add("hidden");

  document
    .getElementById("homeworkSection")
    .classList.remove("hidden");

  document
    .getElementById("formSection")

/* =========================
   ДОМАШКИ
========================= */

let homework=[];

try{

  homework=
    JSON.parse(
      localStorage.getItem("rz232_homework") || "[]"
    );

}catch(e){

  homework=[];

}


let currentFilter="all";
let editingId=null;


/* =========================
   ФАЙЛИ — INDEXEDDB
========================= */

let fileDB=null;

const dbRequest=
  indexedDB.open("RZ232Files",1);


dbRequest.onupgradeneeded=function(event){

  const database=
    event.target.result;

  if(!database.objectStoreNames.contains("files")){

    database.createObjectStore("files");

  }

};


dbRequest.onsuccess=function(event){

  fileDB=
    event.target.result;

};


function saveFile(id,file){

  return new Promise((resolve,reject)=>{

    if(!fileDB){

      reject();
      return;

    }

    const transaction=
      fileDB.transaction(
        "files",
        "readwrite"
      );

    transaction
      .objectStore("files")
      .put(file,String(id));

    transaction.oncomplete=
      ()=>resolve();

    transaction.onerror=
      ()=>reject();

  });

}


function deleteFile(id){

  if(!fileDB){
    return;
  }

  const transaction=
    fileDB.transaction(
      "files",
      "readwrite"
    );

  transaction
    .objectStore("files")
    .delete(String(id));

}


function openFile(id){

  if(!fileDB){

    alert("Сховище файлів ще завантажується. Спробуй ще раз.");
    return;

  }


  const transaction=
    fileDB.transaction(
      "files",
      "readonly"
    );

  const request=
    transaction
      .objectStore("files")
      .get(String(id));


  request.onsuccess=function(){

    const file=
      request.result;


    if(!file){

      alert("Файл не знайдено на цьому пристрої.");
      return;

    }


    const url=
      URL.createObjectURL(file);

    const a=
      document.createElement("a");

    a.href=url;
    a.download=file.name || "file";

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>URL.revokeObjectURL(url),
      3000
    );

  };

}


/* =========================
   ФОРМА ДОМАШКИ
========================= */

function openHomeworkForm(subject=""){

  document
    .getElementById("scheduleSection")
    .classList.add("hidden");

  document
    .getElementById("homeworkSection")
    .classList.add("hidden");

  document
    .getElementById("formSection")
    .classList.remove("hidden");


  document.getElementById("headerText").textContent=
    "Додати домашку";

  document.getElementById("formTitle").textContent=
    "📝 Нова домашка";


  editingId=null;


  document.getElementById("hwText").value="";
  document.getElementById("hwDue").value="";
  document.getElementById("hwFile").value="";
  document.getElementById("currentFile").textContent="";


  if(subject){

    document.getElementById("hwSubject").value=
      subject;

  }

}


function cancelForm(){

  openHomework();

}


function editHomework(id){

  const item=
    homework.find(
      x=>x.id===id
    );

  if(!item){
    return;
  }


  editingId=id;


  document
    .getElementById("homeworkSection")
    .classList.add("hidden");

  document
    .getElementById("scheduleSection")
    .classList.add("hidden");

  document
    .getElementById("formSection")
    .classList.remove("hidden");


  document.getElementById("headerText").textContent=
    "Редагування";

  document.getElementById("formTitle").textContent=
    "✏️ Редагувати домашку";


  document.getElementById("hwSubject").value=
    item.subject;

  document.getElementById("hwText").value=
    item.text;

  document.getElementById("hwDue").value=
    item.dueDate;

  document.getElementById("hwFile").value="";


  document.getElementById("currentFile").textContent=
    item.fileName
    ? `📎 Прикріплено: ${item.fileName}`
    : "";

}


/* =========================
   ЗБЕРЕГТИ ДОМАШКУ
========================= */

async function saveHomework(){

  const subject=
    document.getElementById("hwSubject").value;

  const text=
    document.getElementById("hwText").value.trim();

  const dueDate=
    document.getElementById("hwDue").value;

  const file=
    document.getElementById("hwFile").files[0];


  if(!text){

    alert("Напиши домашнє завдання.");
    return;

  }


  if(!dueDate){

    alert("Вкажи дату здачі.");
    return;

  }


  if(file && file.size>20*1024*1024){

    alert("Файл завеликий. Максимальний розмір — 20 МБ.");
    return;

  }


  if(editingId){

    const item=
      homework.find(
        x=>x.id===editingId
      );


    if(!item){
      return;
    }


    item.subject=subject;
    item.text=text;
    item.dueDate=dueDate;


    if(file){

      item.fileName=
        file.name;

      try{

        await saveFile(
          editingId,
          file
        );

      }catch(e){

        alert("Домашку збережено, але файл не вдалося зберегти.");

      }

    }

  }

  else{

    const id=
      Date.now();


    const item={

      id:id,
      subject:subject,
      text:text,
      dueDate:dueDate,
      done:false,
      createdAt:new Date().toISOString(),
      fileName:file ? file.name : ""

    };


    homework.push(item);


    if(file){

      try{

        await saveFile(
          id,
          file
        );

      }catch(e){

        alert("Домашку збережено, але файл не вдалося зберегти.");

      }

    }

  }


  localStorage.setItem(
    "rz232_homework",
    JSON.stringify(homework)
  );


  editingId=null;

  updateHomeworkCount();

  openHomework();

}


/* =========================
   ДЕДЛАЙНИ
========================= */

function dueDateObject(value){

  const parts=
    value.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2]),
    12
  );

}


function formatDueDate(value){

  const parts=
    value.split("-");

  return `${parts[2]}.${parts[1]}.${parts[0]}`;

}


function deadlineInfo(value){

  const today=
    dateOnly(new Date());

  const due=
    dueDateObject(value);

  const diff=
    Math.round(
      (due-today)/86400000
    );


  if(diff<0){

    return{
      text:`⚠️ Прострочено на ${Math.abs(diff)} дн.`,
      css:"overdue"
    };

  }


  if(diff===0){

    return{
      text:"🔥 Здати сьогодні",
      css:"todayDeadline"
    };

  }


  if(diff===1){

    return{
      text:"⏳ Здати завтра",
      css:"soon"
    };

  }


  if(diff===2){

    return{
      text:"⏳ Залишилось 2 дні",
      css:"soon"
    };

  }


  if(diff<=4){

    return{
      text:`⏳ Залишилось ${diff} дні`,
      css:"soon"
    };

  }


  return{
    text:`📅 До ${formatDueDate(value)} • залишилось ${diff} дн.`,
    css:""
  };

}


/* =========================
   СПИСОК ДОМАШОК
========================= */

function renderHomework(){

  let list=
    [...homework];


  list.sort(
    (a,b)=>
      a.dueDate.localeCompare(b.dueDate)
  );


  const today=
    dateOnly(new Date());


  if(currentFilter==="active"){

    list=
      list.filter(item=>
        !item.done &&
        dueDateObject(item.dueDate)>=today
      );

  }


  if(currentFilter==="overdue"){

    list=
      list.filter(item=>
        !item.done &&
        dueDateObject(item.dueDate)<today
      );

  }


  if(currentFilter==="done"){

    list=
      list.filter(
        item=>item.done
      );

  }


  const container=
    document.getElementById("homeworkList");


  if(!list.length){

    container.innerHTML=`

      <div class="day">
        <div class="empty">
          Домашніх завдань тут поки немає 😊
        </div>
      </div>

    `;

    updateHomeworkCount();

    return;

  }


  let html="";


  list.forEach(item=>{

    const deadline=
      deadlineInfo(item.dueDate);


    html+=`

      <div class="hwCard ${item.done?"done":""}">

        <div class="hwSubject">
          ${escapeHtml(item.subject)}
        </div>


        <div class="hwText">
          ${escapeHtml(item.text)}
        </div>


        <div class="deadline ${deadline.css}">
          ${deadline.text}
        </div>


        ${
          item.fileName
          ?
          `
          <div class="fileBox">

            📎 ${escapeHtml(item.fileName)}

            <br>

            <button onclick="openFile(${item.id})">
              ⬇️ Відкрити файл
            </button>

          </div>
          `
          :
          ""
        }


        <div class="hwActions">

          <button
            class="doneBtn"
            onclick="toggleDone(${item.id})">

            ${item.done ? "↩️ Повернути" : "✅ Виконано"}

          </button>


          <button
            class="editBtn"
            onclick="editHomework(${item.id})">

            ✏️ Змінити

          </button>


          <button
            class="deleteBtn"
            onclick="deleteHomework(${item.id})">

            🗑 Видалити

          </button>

        </div>

      </div>

    `;

  });


  container.innerHTML=
    html;


  updateHomeworkCount();

}


/* =========================
   ДІЇ З ДОМАШКОЮ
========================= */

function toggleDone(id){

  const item=
    homework.find(
      x=>x.id===id
    );


  if(!item){
    return;
  }


  item.done=
    !item.done;


  localStorage.setItem(
    "rz232_homework",
    JSON.stringify(homework)
  );


  renderHomework();

}


function deleteHomework(id){

  if(!confirm("Точно видалити цю домашку?")){
    return;
  }


  homework=
    homework.filter(
      x=>x.id!==id
    );


  deleteFile(id);


  localStorage.setItem(
    "rz232_homework",
    JSON.stringify(homework)
  );


  renderHomework();

}


/* =========================
   ФІЛЬТРИ
========================= */

function setFilter(filter){

  currentFilter=
    filter;


  document
    .querySelectorAll(".filters button")
    .forEach(
      button=>
        button.classList.remove("active")
    );


  const ids={
    all:"fAll",
    active:"fActive",
    overdue:"fOverdue",
    done:"fDone"
  };


  document
    .getElementById(ids[filter])
    .classList.add("active");


  renderHomework();

}


/* =========================
   ЛІЧИЛЬНИК
========================= */

function updateHomeworkCount(){

  const count=
    homework.filter(
      item=>!item.done
    ).length;


  document.getElementById("hwCount").textContent=
    count ? `(${count})` : "";

}


/* =========================
   БЕЗПЕЧНИЙ ТЕКСТ
========================= */

function escapeHtml(text){

  const div=
    document.createElement("div");

  div.textContent=
    text;

  return div.innerHTML;

}


/* =========================
   ЗАПУСК
========================= */

updateHomeworkCount();
showSelectedDay();

</script>
