<script>

/* =============================
   СПИСОК ПРЕДМЕТІВ
============================= */

const subjects=[
"Основи стеганографії",
"Проєктування захищених інформаційних систем",
"Управління доступом",
"Методи оцінки захищеності інформаційних систем",
"Основи захищених хмарних технологій",
"Основи захисту мобільних пристроїв",
"Управління кібербезпекою"
];

const subjectSelect=document.getElementById("hwSubject");

subjects.forEach(s=>{
  const option=document.createElement("option");
  option.value=s;
  option.textContent=s;
  subjectSelect.appendChild(option);
});


/* =============================
   НАВЧАЛЬНІ ТИЖНІ
============================= */

const semesterStart=new Date(2026,8,1,12);
const weekOneMonday=new Date(2026,7,31,12);

function dateOnly(date){
  return new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate(),
    12
  );
}

function getAcademicWeek(date){

  const d=dateOnly(date);

  if(d<semesterStart)return 0;

  const diff=Math.floor(
    (d-weekOneMonday)/86400000
  );

  return Math.floor(diff/7)+1;
}

function lessonIsActive(lesson,week){

  if(week<1||week>15)return false;

  if(lesson.weeks==="all")return true;

  if(lesson.weeks==="even")
    return week%2===0;

  if(lesson.weeks==="odd")
    return week%2!==0;

  return false;
}

function formatDate(date){

  return date.toLocaleDateString(
    "uk-UA",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}

function weeksText(type){

  if(type==="even")
    return "Парні тижні: 2, 4, 6, 8, 10, 12, 14";

  if(type==="odd")
    return "Непарні тижні: 1, 3, 5, 7, 9, 11, 13, 15";

  return "Кожного тижня";
}


/* =============================
   РЕНДЕР ДНЯ
============================= */

function renderDayCard(date){

  const dayNumber=date.getDay();
  const week=getAcademicWeek(date);

  if(dayNumber===0||dayNumber===6){

    const name=
      dayNumber===6?"Субота":"Неділя";

    return `
    <div class="day">
      <div class="day-title">
        ${name}
        <span class="date">${formatDate(date)}</span>
      </div>
      <div class="empty">Вихідний 🎉</div>
    </div>`;
  }

  const day=schedule[dayNumber];

  const lessons=day.lessons.filter(
    l=>lessonIsActive(l,week)
  );

  let html=`
  <div class="day">
    <div class="day-title">
      ${day.name}
      <span class="date">${formatDate(date)}</span>
    </div>
  `;

  if(!lessons.length){
    html+=`<div class="empty">Пар немає 🎉</div>`;
  }

  lessons.forEach(l=>{

    const encodedSubject=
      encodeURIComponent(l.subject);

    html+=`
    <div class="lesson">

      <div>
        <div class="time">${times[l.number]}</div>
        <div class="period">${l.number} пара</div>
      </div>

      <div>

        <div class="subject">${l.subject}</div>

        <div class="type">${l.type}</div>

        ${
          l.teacher
          ? `<div class="teacher">👨‍🏫 ${l.teacher}</div>`
          : ""
        }

        <div class="weeks">${weeksText(l.weeks)}</div>

        <div class="lesson-actions">

          ${
            l.link
            ? `<a class="join"
                 href="${l.link}"
                 target="_blank"
                 rel="noopener noreferrer">
                 🎥 Приєднатися
               </a>`
            : ""
          }

          <button
            class="hw-small"
            onclick="openHomeworkForm(decodeURIComponent('${encodedSubject}'))">
            📝 Домашка
          </button>

        </div>

      </div>

    </div>`;
  });

  html+="</div>";

  return html;
}


/* =============================
   НАВІГАЦІЯ
============================= */

let selectedDate=dateOnly(new Date());

function renderWeekInfo(date){

  const week=getAcademicWeek(date);

  let text;

  if(week<1){
    text="Навчальний семестр ще не розпочався";
  }
  else if(week>15){
    text="15 навчальних тижнів завершено";
  }
  else{
    text=`📚 ${week}-й навчальний тиждень • ${
      week%2===0?"парний":"непарний"
    }`;
  }

  document.getElementById("weekInfo").innerHTML=
    `<div class="week-info">${text}</div>`;
}

function showSelectedDay(){

  document.getElementById("headerText").textContent=
    formatDate(selectedDate);

  renderWeekInfo(selectedDate);

  document.getElementById("scheduleContent").innerHTML=
    renderDayCard(selectedDate);
}

function previousDay(){
  selectedDate.setDate(selectedDate.getDate()-1);
  selectedDate=dateOnly(selectedDate);
  showSelectedDay();
}

function nextDay(){
  selectedDate.setDate(selectedDate.getDate()+1);
  selectedDate=dateOnly(selectedDate);
  showSelectedDay();
}

function goToday(){
  selectedDate=dateOnly(new Date());
  showSelectedDay();
}

function showWholeWeek(){

  const current=dateOnly(selectedDate);

  let day=current.getDay();

  if(day===0)day=7;

  const monday=new Date(current);

  monday.setDate(
    current.getDate()-day+1
  );

  renderWeekInfo(monday);

  document.getElementById("headerText").textContent=
    "Весь тиждень";

  let html="";

  for(let i=0;i<5;i++){

    const d=new Date(monday);

    d.setDate(monday.getDate()+i);

    html+=renderDayCard(d);
  }

  document.getElementById("scheduleContent").innerHTML=html;
}


/* =============================
   ВКЛАДКИ
============================= */

function openSchedule(){

  document.getElementById("scheduleSection").classList.remove("hidden");
  document.getElementById("homeworkSection").classList.add("hidden");
  document.getElementById("homeworkFormSection").classList.add("hidden");

  document.getElementById("scheduleTab").classList.add("active");
  document.getElementById("homeworkTab").classList.remove("active");

  showSelectedDay();
}

function openHomework(){

  document.getElementById("scheduleSection").classList.add("hidden");
  document.getElementById("homeworkSection").classList.remove("hidden");
  document.getElementById("homeworkFormSection").classList.add("hidden");

  document.getElementById("scheduleTab").classList.remove("active");
  document.getElementById("homeworkTab").classList.add("active");

  document.getElementById("headerText").textContent=
    "Домашні завдання";

  renderHomework();
}


/* =============================

============================= */

let homework=

  );

let currentFilter="all";
let editingId=null;


/* =============================
   INDEXED DB ДЛЯ ФАЙЛІВ
============================= */

let db;

const dbRequest=
  indexedDB.open("RZ232Files",1);

dbRequest.onupgradeneeded=function(e){

  const database=e.target.result;

  if(!database.objectStoreNames.contains("files")){
    database.createObjectStore("files");
  }
};

dbRequest.onsuccess=function(e){
  db=e.target.result;
};

function saveFile(id,file){

  return new Promise((resolve,reject)=>{

    if(!db){
      reject("DB not ready");
      return;
    }

    const transaction=
      db.transaction("files","readwrite");

    const store=
      transaction.objectStore("files");

    store.put(file,String(id));

    transaction.oncomplete=()=>resolve();
    transaction.onerror=()=>reject();
  });
}

function deleteStoredFile(id){

  if(!db)return;

  const transaction=
    db.transaction("files","readwrite");

  transaction
    .objectStore("files")
    .delete(String(id));
}

function openStoredFile(id){

  if(!db){
    alert("Файл ще не готовий. Спробуй ще раз.");
    return;
  }

  const transaction=
    db.transaction("files","readonly");

  const request=
    transaction
      .objectStore("files")
      .get(String(id));

  request.onsuccess=function(){

    const file=request.result;

    if(!file){
      alert("Файл не знайдено на цьому пристрої.");
      return;
    }

    const url=URL.createObjectURL(file);

    const a=document.createElement("a");
    a.href=url;
    a.download=file.name||"file";
    a.target="_blank";
    a.click();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },3000);
  };
}


/* =============================
   ФОРМА ДОМАШКИ
============================= */

function openHomeworkForm(subject=""){

  document.getElementById("scheduleSection").classList.add("hidden");
  document.getElementById("homeworkSection").classList.add("hidden");
  document.getElementById("homeworkFormSection").classList.remove("hidden");

  document.getElementById("headerText").textContent=
    "Додати домашку";

  editingId=null;

  document.getElementById("formTitle").textContent=
    "📝 Нова домашка";

  document.getElementById("hwText").value="";
  document.getElementById("hwDue").value="";
  document.getElementById("hwFile").value="";
  document.getElementById("currentFile").textContent="";

  if(subject){
    document.getElementById("hwSubject").value=subject;
  }
}

function cancelHomeworkForm(){
  openHomework();
}

function editHomework(id){

  const item=
    homework.find(x=>x.id===id);

  if(!item)return;

  editingId=id;

  document.getElementById("homeworkSection").classList.add("hidden");
  document.getElementById("scheduleSection").classList.add("hidden");
  document.getElementById("homeworkFormSection").classList.remove("hidden");

  document.getElementById("headerText").textContent=
    "Редагування";

  document.getElementById("formTitle").textContent=
    "✏️ Редагувати домашку";

  document.getElementById("hwSubject").value=
    item.subject;

  document.getElementById("hwText").value=
    item.text;

  document.getElementById("hwDue").value=
    item.dueDate;

  document.getElementById("hwFile").value="";

  document.getElementById("currentFile").textContent=
    item.fileName
    ? "📎 Зараз прикріплено: "+item.fileName
    : "";
}


/* =============================
   ЗБЕРЕЖЕННЯ
============================= */

async function saveHomework(){

  const subject=
    document.getElementById("hwSubject").value;

  const text=
    document.getElementById("hwText").value.trim();

  const dueDate=
    document.getElementById("hwDue").value;

  const fileInput=
    document.getElementById("hwFile");

  const file=fileInput.files[0];

  if(!text){
    alert("Напиши, що потрібно зробити.");
    return;
  }

  if(!dueDate){
    alert("Вкажи дату, до якої потрібно здати.");
    return;
  }

  if(editingId){

    const item=
      homework.find(x=>x.id===editingId);

    item.subject=subject;
    item.text=text;
    item.dueDate=dueDate;

    if(file){

      item.fileName=file.name;

      try{
        await saveFile(editingId,file);
      }catch(e){
        alert("Не вдалося зберегти файл.");
      }
    }

  }else{

    const id=Date.now();

    const item={
      id:id,
      subject:subject,
      text:text,
      dueDate:dueDate,
      done:false,
      createdAt:new Date().toISOString(),
      fileName:file?file.name:""
    };

    homework.push(item);

    if(file){

      try{
        await saveFile(id,file);
      }catch(e){
        alert("Домашка збережена, але файл не вдалося зберегти.");
      }
    }
  }

  localStorage.setItem(
    "rz232_homework",
    JSON.stringify(homework)
  );

  editingId=null;

  updateHomeworkCount();
  openHomework();
}


/* =============================
   СТАТУС ДЕДЛАЙНУ
============================= */

function getDeadlineInfo(dueDate){

  const today=dateOnly(new Date());

  const parts=dueDate.split("-");

  const due=new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2]),
    12
  );

  const diff=
    Math.round(
      (due-today)/86400000
    );

  if(diff<0){
    return{
      text:`⚠️ Прострочено на ${Math.abs(diff)} дн.`,
      className:"overdue"
    };
  }

  if(diff===0){
    return{
      text:"🔥 Здати сьогодні",
      className:"todayDeadline"
    };
  }

  if(diff===1){
    return{
      text:"⏳ Здати завтра",
      className:"soon"
    };
  }

  if(diff<=3){
    return{
      text:`⏳ Залишилось ${diff} дні`,
      className:"soon"
    };
  }

  return{
    text:`📅 До ${formatDueDate(dueDate)} • залишилось ${diff} дн.`,
    className:""
  };
}

function formatDueDate(dateString){

  const p=dateString.split("-");

  return `${p[2]}.${p[1]}.${p[0]}`;
}


/* =============================
   HOMEWORK LIST
============================= */

function renderHomework(){

  let list=[...homework];

  const today=dateOnly(new Date());

  list.sort((a,b)=>
    a.dueDate.localeCompare(b.dueDate)
  );

  if(currentFilter==="active"){
    list=list.filter(x=>{
      if(x.done)return false;

      const p=x.dueDate.split("-");
      const due=
        new Date(+p[0],+p[1]-1,+p[2],12);

      return due>=today;
    });
  }

  if(currentFilter==="overdue"){
    list=list.filter(x=>{

      if(x.done)return false;

      const p=x.dueDate.split("-");
      const due=
        new Date(+p[0],+p[1]-1,+p[2],12);

      return due<today;
    });
  }

  if(currentFilter==="done"){
    list=list.filter(x=>x.done);
  }

  const box=
    document.getElementById("homeworkList");

  if(!list.length){

    box.innerHTML=`
    <div class="day">
      <div class="empty">
        Тут поки нічого немає 😊
      </div>
    </div>`;

    updateHomeworkCount();
    return;
  }

  let html="";

  list.forEach(item=>{

    const deadline=
      getDeadlineInfo(item.dueDate);

    html+=`
    <div class="hw-card ${item.done?"done":""}">

      <div class="hw-title">
        ${escapeHtml(item.subject)}
      </div>

      <div class="hw-text">
        ${escapeHtml(item.text)}
      </div>

      <div class="deadline ${deadline.className}">
        ${deadline.text}
      </div>

      ${
        item.fileName
        ? `
        <div class="file-box">
          📎 ${escapeHtml(item.fileName)}
          <br>
          <button
            class="file-open"
            onclick="openStoredFile(${item.id})">
            Відкрити файл
          </button>
        </div>
        `
        : ""
      }

      <div class="hw-actions">

        <button
          class="done-btn"
          onclick="toggleDone(${item.id})">
          ${item.done?"↩️ Повернути":"✅ Виконано"}
        </button>

        <button
          class="edit-btn"
          onclick="editHomework(${item.id})">
          ✏️ Змінити
        </button>

        <button
          class="delete-btn"
          onclick="deleteHomework(${item.id})">
          🗑 Видалити
        </button>

      </div>

    </div>`;
  });

  box.innerHTML=html;

  updateHomeworkCount();
}

function toggleDone(id){

  const item=
    homework.find(x=>x.id===id);

  if(!item)return;

  item.done=!item.done;

  localStorage.setItem(
    "rz232_homework",
    JSON.stringify(homework)
  );

  renderHomework();
}

function deleteHomework(id){

  if(!confirm("Видалити цю домашку?"))
    return;

  homework=
    homework.filter(x=>x.id!==id);

  deleteStoredFile(id);

  localStorage.setItem(
    "rz232_homework",
    JSON.stringify(homework)
  );

  renderHomework();
}

function setFilter(filter){

  currentFilter=filter;

  document
    .querySelectorAll(".filters button")
    .forEach(b=>b.classList.remove("active"));

  const map={
    all:"filterAll",
    active:"filterActive",
    overdue:"filterOverdue",
    done:"filterDone"
  };

  document
    .getElementById(map[filter])
    .classList.add("active");

  renderHomework();
}

function updateHomeworkCount(){

  const active=
    homework.filter(x=>!x.done).length;

  document.getElementById("hwCount").textContent=
    active>0?`(${active})`:"";
}


/* =============================
   БЕЗПЕЧНЕ ВІДОБРАЖЕННЯ ТЕКСТУ
============================= */

function escapeHtml(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;
}


/* =============================
   ЗАПУСК
============================= */

updateHomeworkCount();
showSelectedDay();

</script>
