<style>

.homeTop,.formCard{

<body>

<script>

const times={
1:"08:00–09:35",
2:"09:50–11:25",
3:"11:40–13:15",
4:"13:30–15:05"
};


/* ПОСИЛАННЯ */

const links={

steg:
"https://us05web.zoom.us/j/6012015122?pwd=bEp2tsMJoxeYHeevUVF1AQGR0GnBcG.1",

protected:
"https://meet.google.com/rum-tati-rno",

"https://us04web.zoom.us/j/3856787724?pwd=NnNzc1B6SWk5UkNsZ2FKSHE1VE85Zz09",

"https://meet.google.com/mgt-bmnn-hgu",

"https://us04web.zoom.us/j/75523031710?pwd=8qb2Fz4vdLcajVKsxlX7chpuQ6PCSH.1",

"https://meet.google.com/dpd-mvur-nbi",

"https://meet.google.com/rzc-eycg-ooq",

"https://us04web.zoom.us/j/5488209266?pwd=kAn1qlrBilMOIYGQ7ZDw48bFbBobCY.1&omn=74899672410"

/* НОВИЙ РОЗКЛАД */

const schedule={

1:{

{

link:links.sadchenko
},

{

weeks:"even",

]},

2:{

{

},

{

teacher:"Агаджанян О.В.",
weeks:"all",
link:links.agadzhanyan
}

]},

3:{
name:"Середа",
lessons:[

{
number:2,
subject:"Основи стеганографії",
type:"Лабораторна",
teacher:"Борисенко І.І.",
weeks:"all",
link:links.steg
},

{
number:3,
subject:"Управління кібербезпекою",
type:"Лекція",
teacher:"Мельник М.О.",
weeks:"all",
link:links.cyber
},

{
number:4,
subject:"Управління кібербезпекою",
type:"Лабораторна",
teacher:"Мельник М.О.",
weeks:"all",
link:links.cyber
}

]},

4:{
name:"Четвер",
lessons:[

{
number:1,
subject:"Управління доступом",
type:"Лабораторна",
teacher:"Вінковська І.С.",
weeks:"all",
link:links.accessLab
},

{
number:2,
subject:"Методи оцінки захищеності інформаційних систем",
type:"Лабораторна",
teacher:"Дорофєєв Ю.М.",
weeks:"all",
link:links.methodsLab
},

{
number:3,
subject:"Основи захисту мобільних пристроїв",
type:"Лекція",
teacher:"Садченко А.В.",
weeks:"all",
link:links.sadchenko
}

]},

5:{name:"П’ятниця",lessons:[]}

};


/* ПРЕДМЕТИ */

const subjects=[
"Основи стеганографії",
"Проєктування захищених інформаційних систем",
"Управління доступом",
"Методи оцінки захищеності інформаційних систем",
"Основи захисту мобільних пристроїв",
"Управління кібербезпекою"
];

subjects.forEach(s=>{
const o=document.createElement("option");
o.value=s;
o.textContent=s;
document.getElementById("hwSubject").appendChild(o);
});


/* НАВЧАЛЬНІ ТИЖНІ */

const semesterStart=new Date(2026,8,1,12);
const weekOneMonday=new Date(2026,7,31,12);

function dateOnly(d){
return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
}

function getAcademicWeek(d){

d=dateOnly(d);

if(d<semesterStart)return 0;

return Math.floor(
Math.floor((d-weekOneMonday)/86400000)/7
)+1;

}

function lessonActive(l,w){

if(w<1||w>15)return false;

if(l.weeks==="all")return true;
if(l.weeks==="even")return w%2===0;
if(l.weeks==="odd")return w%2!==0;

return false;
}

function formatDate(d){

return d.toLocaleDateString("uk-UA",{
day:"2-digit",
month:"2-digit",
year:"numeric"
});

}

function weeksText(type){

if(type==="even")
return "Парні тижні: 2, 4, 6, 8, 10, 12, 14";

if(type==="odd")
return "Непарні тижні: 3, 5, 7, 9, 11, 13, 15";

return "1–15 тижні";
}


/* ДЕНЬ */

function renderDay(date){

const dn=date.getDay();
const week=getAcademicWeek(date);

if(dn===0||dn===6){

return `
<div class="day">
<div class="dayTitle">
${dn===6?"Субота":"Неділя"}
<span class="date">${formatDate(date)}</span>
</div>
<div class="empty">Вихідний 🎉</div>
</div>`;

}

const day=schedule[dn];

const lessons=day.lessons.filter(
l=>lessonActive(l,week)
);

let html=`
<div class="day">
<div class="dayTitle">
${day.name}
<span class="date">${formatDate(date)}</span>
</div>`;

if(!lessons.length){
html+=`<div class="empty">Пар немає 🎉</div>`;
}

lessons.forEach(l=>{

html+=`
<div class="lesson">

<div>
<div class="time">${times[l.number]}</div>
<div class="period">${l.number} пара</div>
</div>

<div>

<div class="subject">${l.subject}</div>
<div class="type">${l.type}</div>
<div class="teacher">👨‍🏫 ${l.teacher}</div>
<div class="weeks">${weeksText(l.weeks)}</div>

<div class="actions">

${l.link?`
<a class="join"
href="${l.link}"
target="_blank"
rel="noopener noreferrer">
🎥 Приєднатися
</a>`:""}

<button class="hwButton"
onclick='openHomeworkForm(${JSON.stringify(l.subject)})'>
📝 Домашка
</button>

</div>

</div>
</div>`;

});

html+="</div>";

return html;
}


/* НАВІГАЦІЯ */

let selectedDate=dateOnly(new Date());

function renderWeekInfo(date){

const week=getAcademicWeek(date);

let text;

if(week<1)text="Навчання ще не розпочалося";
else if(week>15)text="Навчальні тижні завершено";
else text=
`📚 ${week}-й навчальний тиждень • ${week%2===0?"парний":"непарний"}`;

document.getElementById("weekInfo").innerHTML=
`<div class="weekInfo">${text}</div>`;

}

function showSelectedDay(){

document.getElementById("headerText").textContent=
formatDate(selectedDate);

renderWeekInfo(selectedDate);

document.getElementById("scheduleContent").innerHTML=
renderDay(selectedDate);

}

function previousDay(){
selectedDate.setDate(selectedDate.getDate()-1);
showSelectedDay();
}

function nextDay(){
selectedDate.setDate(selectedDate.getDate()+1);
showSelectedDay();
}

function goToday(){
selectedDate=dateOnly(new Date());
showSelectedDay();
}

function showWholeWeek(){

let d=dateOnly(selectedDate);

let day=d.getDay();
if(day===0)day=7;

const monday=new Date(d);
monday.setDate(d.getDate()-day+1);

renderWeekInfo(monday);

document.getElementById("headerText").textContent=
"Весь тиждень";

let html="";

for(let i=0;i<5;i++){

const x=new Date(monday);
x.setDate(monday.getDate()+i);

html+=renderDay(x);

}

document.getElementById("scheduleContent").innerHTML=html;

}


/* ВКЛАДКИ */

function openSchedule(){

scheduleSection.classList.remove("hidden");
homeworkSection.classList.add("hidden");
formSection.classList.add("hidden");

scheduleTab.classList.add("active");
homeworkTab.classList.remove("active");

showSelectedDay();
}

function openHomework(){

scheduleSection.classList.add("hidden");
homeworkSection.classList.remove("hidden");
formSection.classList.add("hidden");

scheduleTab.classList.remove("active");
homeworkTab.classList.add("active");

headerText.textContent="Домашні завдання";

renderHomework();
}


/* HOMEWORK */

let homework=[];

try{
homework=JSON.parse(localStorage.getItem("rz232_homework")||"[]");
}catch(e){
homework=[];
}

let editingId=null;
let currentFilter="all";


/* ФАЙЛИ */

let fileDB;

const request=indexedDB.open("RZ232Files",1);

request.onupgradeneeded=e=>{

const db=e.target.result;

if(!db.objectStoreNames.contains("files")){
db.createObjectStore("files");
}

};

request.onsuccess=e=>{
fileDB=e.target.result;
};

function storeFile(id,file){

return new Promise((resolve,reject)=>{

if(!fileDB)return reject();

const tr=fileDB.transaction("files","readwrite");

tr.objectStore("files").put(file,String(id));

tr.oncomplete=resolve;
tr.onerror=reject;

});

}

function openStoredFile(id){

if(!fileDB){
alert("Спробуй ще раз за секунду.");
return;
}

const tr=fileDB.transaction("files","readonly");
const req=tr.objectStore("files").get(String(id));

req.onsuccess=()=>{

const file=req.result;

if(!file){
alert("Файл не знайдено.");
return;
}

const url=URL.createObjectURL(file);

const a=document.createElement("a");

a.href=url;
a.download=file.name;
a.click();

setTimeout(()=>URL.revokeObjectURL(url),3000);

};

}


/* ФОРМА */

function openHomeworkForm(subject=""){

scheduleSection.classList.add("hidden");
homeworkSection.classList.add("hidden");
formSection.classList.remove("hidden");

headerText.textContent="Додати домашку";

editingId=null;

formTitle.textContent="📝 Нова домашка";
hwText.value="";
hwDue.value="";
hwFile.value="";
currentFile.textContent="";

if(subject)hwSubject.value=subject;

}

function cancelForm(){
openHomework();
}

function editHomework(id){

const item=homework.find(x=>x.id===id);

if(!item)return;

editingId=id;

homeworkSection.classList.add("hidden");
scheduleSection.classList.add("hidden");
formSection.classList.remove("hidden");

formTitle.textContent="✏️ Редагувати домашку";

hwSubject.value=item.subject;
hwText.value=item.text;
hwDue.value=item.dueDate;
hwFile.value="";

currentFile.textContent=
item.fileName?"📎 "+item.fileName:"";

}


/* ЗБЕРЕЖЕННЯ */

async function saveHomework(){

const subject=hwSubject.value;
const text=hwText.value.trim();
const dueDate=hwDue.value;
const file=hwFile.files[0];

if(!text){
alert("Напиши завдання.");
return;
}

if(!dueDate){
alert("Вкажи дату здачі.");
return;
}

if(file&&file.size>20*1024*1024){
alert("Максимальний розмір файла — 20 МБ.");
return;
}

if(editingId){

const item=homework.find(x=>x.id===editingId);

item.subject=subject;
item.text=text;
item.dueDate=dueDate;

if(file){
item.fileName=file.name;
try{await storeFile(editingId,file)}catch(e){}
}

}else{

const id=Date.now();

homework.push({
id,
subject,
text,
dueDate,
done:false,
fileName:file?file.name:""
});

if(file){
try{await storeFile(id,file)}catch(e){}
}

}

localStorage.setItem(
"rz232_homework",
JSON.stringify(homework)
);

editingId=null;

updateCount();
openHomework();

}


/* ДЕДЛАЙН */

function dueObject(value){

const p=value.split("-");

return new Date(+p[0],+p[1]-1,+p[2],12);

}

function dueLabel(value){

const today=dateOnly(new Date());
const due=dueObject(value);

const diff=Math.round((due-today)/86400000);

if(diff<0)
return {text:`⚠️ Прострочено на ${Math.abs(diff)} дн.`,css:"overdue"};

if(diff===0)
return {text:"🔥 Здати сьогодні",css:"todayDeadline"};

if(diff===1)
return {text:"⏳ Здати завтра",css:"soon"};

if(diff<=3)
return {text:`⏳ Залишилось ${diff} дн.`,css:"soon"};

const p=value.split("-");

return {
text:`📅 До ${p[2]}.${p[1]}.${p[0]} • ${diff} дн.`,
css:""
};

}


/* СПИСОК HOMEWORK */

function renderHomework(){

let list=[...homework];

list.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));

const today=dateOnly(new Date());

if(currentFilter==="active"){
list=list.filter(x=>!x.done&&dueObject(x.dueDate)>=today);
}

if(currentFilter==="overdue"){
list=list.filter(x=>!x.done&&dueObject(x.dueDate)<today);
}

if(currentFilter==="done"){
list=list.filter(x=>x.done);
}

if(!list.length){

homeworkList.innerHTML=`
<div class="day">
<div class="empty">Домашок поки немає 😊</div>
</div>`;

updateCount();
return;
}

homeworkList.innerHTML=list.map(item=>{

const d=dueLabel(item.dueDate);

return `
<div class="hwCard ${item.done?"done":""}">

<div class="hwSubject">${escapeHTML(item.subject)}</div>

<div class="hwText">${escapeHTML(item.text)}</div>

<div class="deadline ${d.css}">
${d.text}
</div>

${item.fileName?`
<div class="fileBox">
📎 ${escapeHTML(item.fileName)}
<br>
<button onclick="openStoredFile(${item.id})">
⬇️ Відкрити файл
</button>
</div>`:""}

<div class="hwActions">

<button class="doneBtn"
onclick="toggleDone(${item.id})">
${item.done?"↩️ Повернути":"✅ Виконано"}
</button>

<button class="editBtn"
onclick="editHomework(${item.id})">
✏️ Змінити
</button>

<button class="deleteBtn"
onclick="deleteHomework(${item.id})">
🗑 Видалити
</button>

</div>

</div>`;

}).join("");

updateCount();

}

function toggleDone(id){

const item=homework.find(x=>x.id===id);

item.done=!item.done;

localStorage.setItem(
"rz232_homework",
JSON.stringify(homework)
);

renderHomework();

}

function deleteHomework(id){

if(!confirm("Видалити домашку?"))return;

homework=homework.filter(x=>x.id!==id);

localStorage.setItem(
"rz232_homework",
JSON.stringify(homework)
);

renderHomework();

}

function setFilter(filter){

currentFilter=filter;

document.querySelectorAll(".filters button")
.forEach(b=>b.classList.remove("active"));

const ids={
all:"fAll",
active:"fActive",
overdue:"fOverdue",
done:"fDone"
};

document.getElementById(ids[filter]).classList.add("active");

renderHomework();

}

function updateCount(){

const count=homework.filter(x=>!x.done).length;

hwCount.textContent=count?`(${count})`:"";

}

function escapeHTML(text){

const div=document.createElement("div");
div.textContent=text;
return div.innerHTML;

}


/* СТАРТ */

updateCount();
showSelectedDay();

</script>

</body>
</html>
